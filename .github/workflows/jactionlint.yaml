name: jactionlint

on:
  pull_request:
    paths:
      - .github/workflows/*.yaml
  push:
    paths:
      - .github/workflows/*.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Validate
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run linter
        uses: docker://ghcr.io/jdx/jactionlint:latest
        with:
          args: --verbose --format github --profile correctness
